server {
    listen 80;
    server_name filitour.com www.filitour.com;
    
    root /var/www/html/public;
    index index.php index.html;
    
    # Ocultar versión de nginx
    server_tokens off;
    
    # Bloquear bots basados en WAF
    if ($is_bot = 1) {
        return 403;
    }

    # Límite general para todas las solicitudes
    limit_req zone=general burst=30 nodelay;
    
    # Timeouts
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 5s;
    send_timeout 10s;
    
    # Tamaño máximo de subida
    client_max_body_size 5M;
    
    # Bloquear archivos ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Archivos estáticos
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
    
    # PHP
    # PHP Login & Admin - Protección contra fuerza bruta
    location ~* (login|admin)\.php$ {
        limit_req zone=login burst=5 nodelay;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # PHP General
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }
    
    # Todo lo demás
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
