# 🛡️ Protección contra DoS básico
limit_req_zone $binary_remote_addr zone=one:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

server {
    listen 80;
    server_name localhost;
    
    # 🚨 AISLAMIENTO ABSOLUTO: Solo esta carpeta es accesible desde internet
    root /var/www/html/public;
    index index.php index.html;

    # Ocultar firmas del servidor
    server_tokens off;

    # 🛡️ Mitigación Slowloris (Cerrar conexiones lentas rápido)
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 5s;
    send_timeout 10s;

    # Limitar tamaño de subidas (evita saturación de buffer)
    client_max_body_size 5M;

    # Bloquear acceso a archivos ocultos (ej. .env, .git)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Bloquear acceso a otras extensiones sensibles por si acaso
    location ~* \.(sql|log|ini|conf)$ {
        deny all;
    }

    # Caché estático (Optimización del Frontend)
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Redirigir todo al index.php (Front Controller)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        limit_req zone=one burst=50 nodelay;
        limit_conn addr 20;
    }

    # Procesar archivos PHP
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }
}

