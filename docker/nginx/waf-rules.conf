# /etc/nginx/conf.d/waf-rules.conf

# 1. Identificación de Bots y Scanners (Bloqueo de User-Agents maliciosos o no deseados)
map $http_user_agent $is_bot {
    default 0;
    ~*(bot|crawl|spider|slurp|search|fetch|curl|wget|postman|yandex|yahoo|baidu|duckduckgo|scanner|sqlmap|nmap|nikto|python|java|go-http-client|urllib|libwww-perl|masscan|zgrab) 1;
}

# 2. Extraer IP real (Soporte nativo para Cloudflare y Proxies)
# Cloudflare envía la IP original en el encabezado CF-Connecting-IP
map $http_cf_connecting_ip $client_real_ip {
    ""      $fallback_ip;
    default $http_cf_connecting_ip;
}

# Si no es Cloudflare, intenta usar X-Forwarded-For o la IP directa
map $http_x_forwarded_for $fallback_ip {
    ""      $remote_addr;
    ~^(?P<firstAddr>[0-9\.]+),?.*$  $firstAddr;
}

# 3. Zonas de Rate Limiting (Prevención de ataques DDoS de Capa 7 y Fuerza Bruta)
# Zona general: permite 20 peticiones por segundo
limit_req_zone $client_real_ip zone=general:10m rate=20r/s;

# Zona de login: límite estricto para evitar fuerza bruta (2 peticiones por segundo)
limit_req_zone $client_real_ip zone=login:10m rate=2r/s;

