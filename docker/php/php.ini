; 🛡️ Seguridad PHP - filitour
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/www/html/app/storage/logs/php-errors.log

; ⚡ Optimización y prevención de saturación (Cuellos de botella)
memory_limit = 128M
max_execution_time = 30
max_input_time = 60
post_max_size = 5M
upload_max_filesize = 5M

; Sesiones seguras
session.cookie_httponly = 1
session.use_strict_mode = 1
session.cookie_samesite = "Strict"

