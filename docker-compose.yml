services:
  webserver:
    image: nginx:alpine
    container_name: filitour_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - filitour_network

  app:
    image: php:8.2-fpm-alpine
    container_name: filitour_php
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    command: sh -c "docker-php-ext-install pdo pdo_mysql && php-fpm"
    depends_on:
      - db
    networks:
      - filitour_network

  db:
    image: mariadb:10.6
    container_name: filitour_mysql
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_DATABASE: filitour_db
    secrets:
      - db_root_password
    # NOTA: En producción, NO expongas el puerto de la BD al público
    # ports:
    #   - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - filitour_network

  # phpmyadmin:
  #   image: phpmyadmin/phpmyadmin
  #   container_name: filitour_pma
  #   environment:
  #     PMA_HOST: db
  #     MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
  #   secrets:
  #     - db_root_password
  #   # NOTA: En producción, COMENTA o ELIMINA este servicio para no exponer phpMyAdmin
  #   ports:
  #     - "8081:80"
  #   depends_on:
  #     - db
  #   networks:
  #     - filitour_network

networks:
  filitour_network:
    driver: bridge

volumes:
  db_data:

secrets:
  db_root_password:
    file: ./secrets/db_root_password.txt

